<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: https://stmakiuddrhaufpqwffv.supabase.co; connect-src 'self' https://stmakiuddrhaufpqwffv.supabase.co wss://stmakiuddrhaufpqwffv.supabase.co; object-src 'none'; base-uri 'self'; form-action 'self'">
  <title>Sign up - Join</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
</head>
<body>
  <main class="auth-page">
    <section class="auth-card" aria-labelledby="signup-heading">
      <h1 id="signup-heading">Sign up</h1>

      <p class="form-message" data-role="message" role="status" aria-live="polite" hidden></p>

      <form id="signup-form" novalidate>
        <div class="form-field">
          <label for="signup-name">Name</label>
          <input id="signup-name" name="name" type="text" autocomplete="name" required maxlength="60">
        </div>
        <div class="form-field">
          <label for="signup-email">Email</label>
          <input id="signup-email" name="email" type="email" autocomplete="email" required maxlength="254">
        </div>
        <div class="form-field">
          <label for="signup-password">Password</label>
          <input id="signup-password" name="password" type="password" autocomplete="new-password" required minlength="8" maxlength="72">
        </div>
        <div class="form-field">
          <label for="signup-confirm-password">Confirm password</label>
          <input id="signup-confirm-password" name="confirm-password" type="password" autocomplete="new-password" required minlength="8" maxlength="72">
        </div>
        <button type="submit" class="button button--primary">Sign up</button>
      </form>

      <p class="auth-switch">Already have an account? <a href="index.html">Log in</a></p>
    </section>
  </main>
  <script type="module" src="js/signup-page.js"></script>
</body>
</html>
