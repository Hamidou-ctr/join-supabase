<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: https://stmakiuddrhaufpqwffv.supabase.co; connect-src 'self' https://stmakiuddrhaufpqwffv.supabase.co wss://stmakiuddrhaufpqwffv.supabase.co; object-src 'none'; base-uri 'self'; form-action 'self'">
  <title>Sign up - Join</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
</head>
<body>
  <div class="auth-page">
    <header class="auth-topbar">
      <a class="logo" href="index.html" aria-label="Join home">
        <svg class="logo-mark" viewBox="-5 -5 90 110" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false">
          <rect class="logo-mark__dot-dark" x="34" y="0" width="22" height="22" />
          <rect class="logo-mark__dot-accent" x="8" y="24" width="22" height="22" />
          <path class="logo-mark__hook" d="M45 30 V62 A22 22 0 0 1 14 82" />
        </svg>
        <span class="logo-text">OIN</span>
      </a>
    </header>

    <main class="auth-main">
      <section class="auth-card" aria-labelledby="signup-heading">
        <a class="auth-back" href="index.html">
          <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
            <line x1="19" y1="12" x2="5" y2="12" />
            <polyline points="12 19 5 12 12 5" />
          </svg>
          <span class="sr-only">Back to log in</span>
        </a>

        <h1 id="signup-heading">Sign up</h1>
        <div class="heading-accent" aria-hidden="true"></div>

        <p class="form-message" data-role="message" role="status" aria-live="polite" hidden></p>

        <form id="signup-form" novalidate>
          <div class="form-field">
            <label for="signup-name" class="sr-only">Name</label>
            <div class="input-icon-field">
              <input id="signup-name" name="name" type="text" placeholder="Name" autocomplete="name" required maxlength="60">
              <span class="field-icon" aria-hidden="true">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
                  <circle cx="12" cy="7" r="4" />
                </svg>
              </span>
            </div>
          </div>
          <div class="form-field">
            <label for="signup-email" class="sr-only">Email</label>
            <div class="input-icon-field">
              <input id="signup-email" name="email" type="email" placeholder="Email" autocomplete="email" required maxlength="254">
              <span class="field-icon" aria-hidden="true">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <rect x="2" y="4" width="20" height="16" rx="2" />
                  <polyline points="22 6 12 13 2 6" />
                </svg>
              </span>
            </div>
          </div>
          <div class="form-field">
            <label for="signup-password" class="sr-only">Password</label>
            <div class="input-icon-field">
              <input id="signup-password" name="password" type="password" placeholder="Password" autocomplete="new-password" required minlength="8" maxlength="72">
              <span class="field-icon" aria-hidden="true">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <rect x="3" y="11" width="18" height="11" rx="2" />
                  <path d="M7 11V7a5 5 0 0 1 10 0v4" />
                </svg>
              </span>
            </div>
          </div>
          <div class="form-field">
            <label for="signup-confirm-password" class="sr-only">Confirm password</label>
            <div class="input-icon-field">
              <input id="signup-confirm-password" name="confirm-password" type="password" placeholder="Confirm Password" autocomplete="new-password" required minlength="8" maxlength="72">
              <span class="field-icon" aria-hidden="true">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <rect x="3" y="11" width="18" height="11" rx="2" />
                  <path d="M7 11V7a5 5 0 0 1 10 0v4" />
                </svg>
              </span>
            </div>
          </div>

          <div class="checkbox-field">
            <input type="checkbox" id="signup-accept-privacy" required>
            <label for="signup-accept-privacy">I accept the <a href="privacy-policy.html">Privacy policy</a></label>
          </div>

          <div class="auth-actions">
            <button type="submit" id="signup-submit" class="button button--primary" disabled>Sign up</button>
          </div>
        </form>
      </section>
    </main>

    <footer class="auth-footer">
      <a href="privacy-policy.html">Privacy Policy</a>
      <a href="legal-notice.html">Legal notice</a>
    </footer>
  </div>
  <script type="module" src="js/signup-page.js"></script>
</body>
</html>
