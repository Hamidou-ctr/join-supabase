<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: https://stmakiuddrhaufpqwffv.supabase.co; connect-src 'self' https://stmakiuddrhaufpqwffv.supabase.co wss://stmakiuddrhaufpqwffv.supabase.co; object-src 'none'; base-uri 'self'; form-action 'self'">
  <title>Log in - Join</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
</head>
<body>
  <main class="auth-page">
    <section class="auth-card" aria-labelledby="login-heading">
      <h1 id="login-heading">Log in</h1>

      <p class="form-message" data-role="message" role="status" aria-live="polite" hidden></p>

      <form id="login-form" novalidate>
        <div class="form-field">
          <label for="login-email">Email</label>
          <input id="login-email" name="email" type="email" autocomplete="email" required maxlength="254">
        </div>
        <div class="form-field">
          <label for="login-password">Password</label>
          <div class="password-field">
            <input id="login-password" name="password" type="password" autocomplete="current-password" required maxlength="72">
            <button type="button" class="password-toggle" aria-controls="login-password" aria-pressed="false" aria-label="Show password">
              <svg class="icon-eye" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                <circle cx="12" cy="12" r="3" />
              </svg>
              <svg class="icon-eye-off" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94" />
                <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19" />
                <line x1="1" y1="1" x2="23" y2="23" />
              </svg>
            </button>
          </div>
        </div>
        <button type="submit" class="button button--primary">Log in</button>
      </form>

      <button type="button" id="guest-login" class="button button--secondary">Log in as Guest</button>

      <p class="auth-switch">Don't have an account? <a href="signup.html">Sign up</a></p>
    </section>
  </main>
  <script type="module" src="js/login-page.js"></script>
</body>
</html>
