<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: https://stmakiuddrhaufpqwffv.supabase.co; connect-src 'self' https://stmakiuddrhaufpqwffv.supabase.co wss://stmakiuddrhaufpqwffv.supabase.co; object-src 'none'; base-uri 'self'; form-action 'self'">
  <title>Contacts - Join</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/contacts.css">
</head>
<body>
  <div class="shell" id="shell">
    <main class="shell-content contacts-content">
      <section class="contacts-list-pane" id="list-pane" aria-label="Contact list">
        <button type="button" class="button button--primary contacts-add" id="add-contact">
          <span>Add new contact</span>
          <img src="assets/img/person_add.svg" alt="" width="32" height="32">
        </button>
        <p class="form-message form-message--error" id="contacts-error" role="alert" hidden></p>
        <p class="contacts-empty" id="contacts-empty" hidden>No contacts yet.</p>
        <div id="contact-list"></div>
      </section>

      <section class="contacts-detail-pane" id="detail-pane" aria-label="Contact details">
        <div class="page-heading">
          <h1>Contacts</h1>
          <p class="page-subtitle">Better with a team</p>
        </div>
        <button type="button" class="back-button contacts-back" id="detail-back">
          <img src="assets/img/icon-arrow-left.svg" alt="Back to contact list" width="21" height="20">
        </button>
        <div id="contact-detail"></div>
      </section>
    </main>
  </div>

  <dialog class="contact-dialog" id="contact-dialog" aria-labelledby="dialog-title">
    <div class="contact-dialog-brand">
      <img src="assets/img/logo-white.svg" alt="" height="56">
      <h2 id="dialog-title"></h2>
      <p class="contact-dialog-subtitle" id="dialog-subtitle"></p>
      <span class="contact-dialog-accent" aria-hidden="true"></span>
    </div>
    <div class="contact-dialog-body">
      <button type="button" class="contact-dialog-close" id="dialog-close">
        <img src="assets/img/close.svg" alt="Close" width="14" height="14">
      </button>
      <div class="contact-dialog-avatar" id="dialog-avatar"></div>
      <form class="contact-form" id="contact-form" novalidate>
        <p class="form-message form-message--error" id="form-error" role="alert" hidden></p>
        <div class="form-field input-icon-field">
          <label class="sr-only" for="contact-name">Name</label>
          <input type="text" id="contact-name" name="name" placeholder="Name" autocomplete="off" maxlength="100" required>
          <span class="field-icon"><img src="assets/img/person.svg" alt="" width="16" height="16"></span>
        </div>
        <div class="form-field input-icon-field">
          <label class="sr-only" for="contact-email">Email</label>
          <input type="email" id="contact-email" name="email" placeholder="Email" autocomplete="off" maxlength="254" required>
          <span class="field-icon"><img src="assets/img/mail.svg" alt="" width="20" height="16"></span>
        </div>
        <div class="form-field input-icon-field">
          <label class="sr-only" for="contact-phone">Phone</label>
          <input type="tel" id="contact-phone" name="phone" placeholder="Phone" autocomplete="off" maxlength="30">
          <span class="field-icon"><img src="assets/img/call.svg" alt="" width="18" height="18"></span>
        </div>
        <div class="contact-form-actions">
          <button type="button" class="button button--secondary" id="form-secondary"></button>
          <button type="submit" class="button button--primary" id="form-submit">
            <span id="form-submit-label"></span>
            <img src="assets/img/check.svg" alt="" width="16" height="12">
          </button>
        </div>
      </form>
    </div>
  </dialog>

  <script type="module" src="js/contacts-page.js"></script>
</body>
</html>
