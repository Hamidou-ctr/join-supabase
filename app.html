<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: https://stmakiuddrhaufpqwffv.supabase.co; connect-src 'self' https://stmakiuddrhaufpqwffv.supabase.co wss://stmakiuddrhaufpqwffv.supabase.co; object-src 'none'; base-uri 'self'; form-action 'self'">
  <title>Summary - Join</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
</head>
<body>
  <div class="shell" id="shell">
    <main class="shell-content">
      <div class="page-heading">
        <h1>Join 360</h1>
        <p class="page-subtitle">Key Metrics at a Glance</p>
      </div>
      <p class="form-message form-message--error" id="summary-error" role="alert" hidden>
        Could not load your tasks. Please try again later.
      </p>

      <div class="summary">
        <div class="summary-tiles">
          <div class="tile tile--half">
            <img class="tile-icon-img" src="assets/img/icon-todo.svg" alt="" width="69" height="69">
            <span class="tile-body"><span class="tile-value" id="count-todo">-</span><span class="tile-label">To-do</span></span>
          </div>
          <div class="tile tile--half">
            <img class="tile-icon-img" src="assets/img/icon-done.svg" alt="" width="69" height="69">
            <span class="tile-body"><span class="tile-value" id="count-done">-</span><span class="tile-label">Done</span></span>
          </div>

          <div class="tile tile--urgent">
            <span class="tile-group">
              <span class="tile-icon tile-icon--urgent" aria-hidden="true">
                <svg class="icon" viewBox="0 0 24 24" focusable="false"><path d="M6 12l6-6 6 6"/><path d="M6 18l6-6 6 6"/></svg>
              </span>
              <span class="tile-body"><span class="tile-value" id="count-urgent">-</span><span class="tile-label">Urgent</span></span>
            </span>
            <span class="tile-divider" aria-hidden="true"></span>
            <span class="tile-body tile-body--deadline">
              <span class="tile-date" id="deadline-date">-</span>
              <span class="tile-label">Upcoming Deadline</span>
            </span>
          </div>

          <div class="tile tile--count">
            <span class="tile-value" id="count-total">-</span><span class="tile-label">Tasks in Board</span>
          </div>
          <div class="tile tile--count">
            <span class="tile-value" id="count-progress">-</span><span class="tile-label">Tasks In Progress</span>
          </div>
          <div class="tile tile--count">
            <span class="tile-value" id="count-feedback">-</span><span class="tile-label">Awaiting Feedback</span>
          </div>
        </div>

        <p class="greeting">
          <span id="greeting-text"></span>
          <strong class="greeting-name" id="greeting-name"></strong>
        </p>
      </div>
    </main>
  </div>
  <script type="module" src="js/app-page.js"></script>
</body>
</html>
